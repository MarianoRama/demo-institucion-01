<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel de fotos</title>
<style>
  :root { --accent: #8C2F44; --accent-dark: #4A1220; --cream: #FAF6F0; --ink: #2B2320; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--cream); font-family: 'Inter', Arial, sans-serif; color: var(--ink); }
  .card { background: #fff; border: 1px solid #E9E0D6; border-radius: 12px; padding: 40px; width: 100%; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 24px 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="password"] { width: 100%; padding: 12px; border: 1px solid #E9E0D6; border-radius: 6px; font-size: 15px; margin-bottom: 16px; }
  button { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--accent-dark); }
  .error { color: #a3302f; font-size: 13px; margin: -8px 0 16px 0; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Panel de fotos del colegio</h1>
    <form id="loginForm">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <p class="error" id="error">Contraseña incorrecta.</p>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.href = '/panel/editor.html';
      } else {
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
